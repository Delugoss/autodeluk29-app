<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Database Application</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Vehicle Database Application</h1>
        <input type="text" id="search" placeholder="Search vehicles...">
    </header>
    <main>
        <div id="vehicle-list">
            <!-- Vehicle items will be populated here -->
        </div>
        <div id="modal" class="modal">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <h2>Vehicle Details</h2>
                <div id="vehicle-details">
                    <!-- Vehicle details will be shown here -->
                </div>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 Vehicle Database Application</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
